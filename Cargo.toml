[package]
name = "tinypt"
version = "0.17.0"
edition = "2024"

[features]
default = ["oidn"]
oidn = ["dep:oidn"]
# GUI ビューア（`viewer` バイナリ）。egui / eframe は重いので既定には入れない
viewer = ["dep:eframe", "dep:rfd"]

[dependencies]
crossbeam = "0.8"
crossbeam-channel = "0.5"
image = { version = "0.25", features = ["exr"] }
exr = "1.7"
quick-xml = "0.37"
oidn = { version = "2.5.1", optional = true }
eframe = { version = "0.31", optional = true, default-features = false, features = ["glow", "default_fonts"] }
rfd = { version = "0.15", optional = true }

[[bin]]
name = "tinypt"
path = "src/main.rs"

[[bin]]
name = "viewer"
path = "src/bin/viewer.rs"
required-features = ["viewer"]

[profile.release]
opt-level = 3
lto = "fat" 
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
debug-assertions = false
overflow-checks = false
incremental = false

# Profiling-friendly build (keeps debug info and frame pointers, disables stripping/LTO).
[profile.profiling]
inherits = "release"
debug = true
strip = "none"
lto = "off"
codegen-units = 1
